spring.application.name=carbonlink-backend
# Render (and most PaaS hosts) inject PORT. Local default stays 8080.
server.port=${PORT:8081}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:demo}

# --- PostgreSQL ---
# Local credentials live in gitignored application-secret.properties. On Render/Neon/Supabase,
# set DATABASE_URL (postgres://...) or SPRING_DATASOURCE_*.
spring.config.import=optional:classpath:application-secret.properties
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/carbonlink}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Explicit dialect avoids DialectResolutionInfo null failures when database is warming up
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# HikariCP connection pool resilience (waits up to 60s on startup for PostgreSQL to accept connections)
spring.datasource.hikari.initialization-fail-timeout=60000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000

# Comma-separated extra CORS origin patterns for a split frontend host. Same-origin deploys
# (frontend served by this app) do not need this.
carbonlink.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:https://*.vercel.app}

# --- OpenRouteService (distance) ---
# Read from the OPENROUTE_API_KEY env var (see .env.example). Empty/missing -> Haversine fallback for every request.
openrouteservice.api.key=${OPENROUTE_API_KEY:}
openrouteservice.api.url=https://api.openrouteservice.org/v2/matrix/driving-car
openrouteservice.timeout.seconds=3
# After one failed lookup, skip OpenRouteService entirely for this long and answer from
# Haversine instead. Without it, an unreachable API costs the full timeout above on EVERY
# uncached city pair, so one "Find Matches" click could stall for timeout x number-of-cities.
openrouteservice.failure-cooldown-seconds=60

# --- Cost estimation ---
# Bulk CO2 transport (tanker truck, full loads) is materially cheaper per ton-km than the
# earlier placeholder rates suggested - lowered from 8.0 to 3.0, then to a more realistic 1.0
# after live testing showed 3.0 still made transport cost dominate the total on longer
# real-world hauls (e.g. a 644km match came out to 2.4x the base price). Still fully
# configurable via this property.
carbonlink.transport.rate-per-km-per-ton=1.0
