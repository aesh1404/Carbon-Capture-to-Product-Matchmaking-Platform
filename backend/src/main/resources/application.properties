spring.application.name=carbonlink-backend
server.port=8080

# --- H2 (file-based, persists between restarts) ---
spring.datasource.url=jdbc:h2:file:./data/carbonlink;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# The dialect is deliberately NOT set: Hibernate selects H2Dialect from the JDBC metadata on
# its own, and stating it explicitly only produces an HHH90000025 deprecation warning at every
# startup.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- OpenRouteService (distance) ---
# Read from the OPENROUTE_API_KEY env var (see .env.example). Empty/missing -> Haversine fallback for every request.
openrouteservice.api.key=${OPENROUTE_API_KEY:}
openrouteservice.api.url=https://api.openrouteservice.org/v2/matrix/driving-car
openrouteservice.timeout.seconds=3
# After one failed lookup, skip OpenRouteService entirely for this long and answer from
# Haversine instead. Without it, an unreachable API costs the full timeout above on EVERY
# uncached city pair, so one "Find Matches" click could stall for timeout x number-of-cities.
openrouteservice.failure-cooldown-seconds=60

# --- Cost estimation ---
# Bulk CO2 transport (tanker truck, full loads) is materially cheaper per ton-km than the
# earlier placeholder rates suggested - lowered from 8.0 to 3.0, then to a more realistic 1.0
# after live testing showed 3.0 still made transport cost dominate the total on longer
# real-world hauls (e.g. a 644km match came out to 2.4x the base price). Still fully
# configurable via this property.
carbonlink.transport.rate-per-km-per-ton=1.0
